<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B1430">
<meta name="description" content="G1: a voice-first phone. Say it and it's done.">
<title>G1</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon.svg">
<link rel="preload" href="/fonts/anek-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/g1.css">
</head>
<body>
<div class="room">
  <div class="device" id="device">
    <main class="screen" id="screen" data-state="idle">
      <header class="status">
        <time id="clock">--:--</time>
        <span class="status-right"><span id="mode">Basic</span><span id="battery"></span></span>
      </header>

      <p class="notice" id="notice" role="status" hidden></p>

      <section class="presence" aria-hidden="true">
        <canvas id="bloom" width="520" height="520"></canvas>
      </section>

      <section class="talk" aria-live="polite">
        <p class="heard" id="heard"></p>
        <p class="said" id="said"></p>
      </section>

      <section class="card" id="card" hidden></section>

      <form class="typebar" id="typebar" hidden>
        <label class="sr" for="typed">Type to G1</label>
        <input id="typed" autocomplete="off" enterkeyhint="send" placeholder="Type what you want">
        <button type="submit">Send</button>
      </form>

      <footer class="controls">
        <button class="ghost" id="keys" type="button" aria-label="Type instead of talking" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6.5 10h.01M10 10h.01M13.5 10h.01M17 10h.01M7.5 14h9"/></svg>
        </button>
        <button class="mic" id="mic" type="button" aria-label="Talk to G1">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
        </button>
        <button class="ghost" id="gear" type="button" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
        </button>
      </footer>
      <p class="hint" id="hint">Tap and talk</p>

      <div class="start" id="start">
        <div class="start-mark">G1</div>
        <p class="start-line">Your phone, without the scrolling. Say it and it's done.</p>
        <button class="primary" id="startBtn" type="button">Start G1</button>
        <p class="start-small">G1 will ask to use the microphone.</p>
      </div>

      <dialog class="sheet" id="settings" aria-labelledby="settingsTitle">
        <form method="dialog" id="settingsForm">
          <div class="sheet-head">
            <h2 id="settingsTitle">Settings</h2>
            <button class="ghost" value="close" aria-label="Close settings">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </div>

          <fieldset>
            <legend>You</legend>
            <label>Your name<input name="userName" autocomplete="given-name"></label>
            <label>Language you speak
              <select name="language"><option value="en-IN">English</option><option value="hi-IN">Hindi / Hinglish</option><option value="te-IN">Telugu</option></select>
            </label>
            <label>Home city<input name="homeCity" placeholder="For weather and travel"></label>
            <label class="check"><input type="checkbox" name="handsfree"> Hands-free: listen for "Hey G1"</label>
          </fieldset>

          <fieldset>
            <legend>Brain</legend>
            <p class="help" id="brainStatus"></p>
            <label>AI service
              <select name="provider"><option value="none">Basic (no AI key)</option><option value="gemini">Google Gemini</option><option value="groq">Groq</option><option value="custom">Other (OpenAI-compatible)</option></select>
            </label>
            <label>AI key<input name="apiKey" type="password" autocomplete="off" placeholder="Stays on this device"></label>
            <label>Model<input name="model" placeholder="Leave empty for the default"></label>
            <label data-only="custom">Service address<input name="baseUrl" placeholder="https://.../v1"></label>
          </fieldset>

          <fieldset>
            <legend>Voice</legend>
            <p class="help" id="voiceStatus"></p>
            <label>G1's voice
              <select name="preset"></select>
            </label>
            <label>Natural voice key (ElevenLabs)<input name="elevenKey" type="password" autocomplete="off" placeholder="Stays on this device"></label>
            <label>Device voice
              <select name="browserVoice"><option value="">Best available</option></select>
            </label>
            <label>Speed<input name="rate" type="range" min="0.8" max="1.3" step="0.05"></label>
            <button class="secondary" type="button" id="hearIt">Hear this voice</button>
          </fieldset>

          <fieldset>
            <legend>This device</legend>
            <label>Device key<input name="passcode" type="password" autocomplete="off" placeholder="Only if your G1 server asks for one"></label>
            <button class="secondary danger" type="button" id="erase">Erase everything on this device</button>
          </fieldset>

          <div class="sheet-foot"><button class="primary" value="save">Save settings</button></div>
        </form>
      </dialog>
    </main>
  </div>

  <aside class="aside">
    <h1>G1</h1>
    <p>Shown at the size of the first iPhone: 115 by 61 mm. On a phone it fills the screen.</p>
    <p class="aside-label">Things to say</p>
    <ul id="examples">
      <li><button type="button">Save Papa's number 9876543210</button></li>
      <li><button type="button">Papa ko WhatsApp karo ki main 8 baje tak aa jaunga</button></li>
      <li><button type="button">Remind me to call the bank at 4 pm</button></li>
      <li><button type="button">What's the weather in Hyderabad</button></li>
      <li><button type="button">Find a hotel in Goa for 2 nights tomorrow</button></li>
      <li><button type="button">Make a video about morning habits</button></li>
      <li><button type="button">Open Instagram</button></li>
    </ul>
    <p class="aside-small">Hold the space bar to talk.</p>
  </aside>
</div>
<script type="module" src="/js/main.js"></script>
</body>
</html>
