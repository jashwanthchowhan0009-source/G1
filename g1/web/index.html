<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>G1</title>
<style>
  :root{--bg:#0b0b0d;--panel:#141418;--line:#26262c;--text:#f2f2f2;--muted:#8d8d96;--orange:#f08c28;--orange2:#ffb45e;--ok:#3ecf8e;--bad:#ff6b6b}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:#050506;color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  body{display:flex;align-items:center;justify-content:center}
  .device{width:min(400px,100vw);height:min(840px,100dvh);background:var(--bg);border-radius:46px;border:10px solid #1c1c21;
    box-shadow:0 0 0 2px #2a2a31,0 30px 80px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden;position:relative}
  @media (max-width:440px){.device{border:0;border-radius:0;width:100vw;height:100dvh;box-shadow:none}}
  .bar{display:flex;justify-content:space-between;padding:14px 26px 6px;font-size:13px;color:var(--muted)}
  .bar b{color:var(--text);font-weight:600}
  .brand{display:flex;align-items:center;gap:8px;padding:2px 22px 0;color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
  .brand i{width:6px;height:6px;border-radius:50%;background:var(--ok)}
  .stage{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;padding:18px 0 8px}
  .orb{width:132px;height:132px;border-radius:50%;position:relative;display:grid;place-items:center;cursor:pointer;
    background:radial-gradient(circle at 35% 30%,#2a1a0c,#0f0b08 70%);border:2px solid #3a2410;transition:transform .2s}
  .orb::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--orange);opacity:.35}
  .orb .eye{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle,#ffd08a 0 18%,var(--orange) 19% 60%,#7a3a08 61%);
    box-shadow:0 0 30px rgba(240,140,40,.55);transition:transform .3s}
  .orb .eye::after{content:"";display:block;width:6px;height:28px;margin:6px auto;border-radius:6px;background:#140a02}
  .listening .orb::before{animation:pulse 1.1s ease-out infinite;opacity:.9}
  .thinking .orb .eye{animation:spin 1.4s linear infinite}
  .speaking .orb{transform:scale(1.05)}
  @keyframes pulse{from{transform:scale(1);opacity:.9}to{transform:scale(1.35);opacity:0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .state{margin-top:14px;font-size:13px;color:var(--muted);min-height:20px}
  .feed{flex:1;overflow-y:auto;padding:8px 18px 12px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
  .msg{max-width:86%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word}
  .me{align-self:flex-end;background:#26201a;border:1px solid #3a2d20;border-bottom-right-radius:6px}
  .g1{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:6px}
  .card{align-self:stretch;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
  .card .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--orange);margin-bottom:6px}
  .card.confirm{border-color:#5a3a16}
  .row{display:flex;gap:8px;margin-top:10px}
  .btn{flex:1;border:0;border-radius:12px;padding:10px;font:inherit;font-weight:600;cursor:pointer}
  .yes{background:var(--orange);color:#1a0d00}.no{background:#24242a;color:var(--text)}
  .card a{color:var(--orange2);text-decoration:none;word-break:break-all}
  .card video{width:100%;max-height:340px;border-radius:12px;background:#000;margin-top:4px}
  .done{opacity:.55;pointer-events:none}
  .dock{display:flex;gap:10px;align-items:center;padding:10px 16px 22px;border-top:1px solid var(--line)}
  .dock input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:22px;padding:12px 16px;font:inherit;outline:none}
  .dock input:focus{border-color:#4a3218}
  .mic{width:50px;height:50px;border-radius:50%;border:0;background:var(--orange);display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
  .mic svg{width:22px;height:22px}
  .lang{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:12px;padding:6px;font:inherit;font-size:12px}
  .hint{color:var(--muted);font-size:13px;text-align:center;padding:4px 24px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:6px 14px}
  .chip{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:6px 10px;font-size:12px;cursor:pointer}
</style>
</head>
<body>
<div class="device" id="dev">
  <div class="bar"><b id="clock">--:--</b><span>4G ▂▄▆ &nbsp;🔋 86%</span></div>
  <div class="brand"><i></i>G1 · <span id="brain">…</span></div>
  <div class="stage">
    <div class="orb" id="orb" title="Tap to talk"><div class="eye"></div></div>
    <div class="state" id="state">Tap the eye or say something</div>
  </div>
  <div class="feed" id="feed">
    <div class="hint">Try one 👇</div>
    <div class="chips" id="chips"></div>
  </div>
  <form class="dock" id="form">
    <select class="lang" id="lang" aria-label="Voice language">
      <option value="en-IN">EN</option><option value="hi-IN">HI</option><option value="te-IN">TE</option>
    </select>
    <input id="input" autocomplete="off" placeholder="Type or tap the mic…">
    <button class="mic" id="mic" type="button" aria-label="Talk">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1a0d00" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
  </form>
</div>
<script>
const $ = s => document.querySelector(s);
const feed = $("#feed"), dev = $("#dev"), state = $("#state");
const params = new URLSearchParams(location.search);
const KEY = params.get("key") || "";
const SESSION = (() => { try { return localStorage.getItem("g1s") || (localStorage.setItem("g1s", crypto.randomUUID().slice(0,12)), localStorage.getItem("g1s")); } catch { return "device"; } })();
const headers = {"Content-Type": "application/json", ...(KEY ? {"x-g1-key": KEY} : {})};

const examples = [
  "Save Papa's number 9876543210",
  "WhatsApp Papa that I'll reach home by 8",
  "Find a hotel in Goa for 2 nights",
  "Book a train from Anantapur to Hyderabad",
  "Make a video about morning habits",
  "Remind me to drink water in 1 minute",
];
for (const e of examples) {
  const c = document.createElement("button"); c.className = "chip"; c.type = "button"; c.textContent = e;
  c.onclick = () => send(e); $("#chips").append(c);
}

function setState(s, label) { dev.classList.remove("listening","thinking","speaking"); if (s) dev.classList.add(s); state.textContent = label || ""; }
function scroll() { feed.scrollTop = feed.scrollHeight; }
function bubble(text, who) { const d = document.createElement("div"); d.className = "msg " + who; d.textContent = text; feed.append(d); scroll(); }

function speak(text) {
  if (!("speechSynthesis" in window) || !text) return setState(null, "Tap the eye or say something");
  const u = new SpeechSynthesisUtterance(text.replace(/[\u{1F300}-\u{1FAFF}☀-➿]/gu, ""));
  u.lang = $("#lang").value; u.rate = 1.05;
  u.onstart = () => setState("speaking", "Speaking…");
  u.onend = u.onerror = () => setState(null, "Tap the eye or say something");
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

function render(reply) {
  bubble(reply.say, "g1");
  for (const c of reply.cards || []) {
    const d = document.createElement("div"); d.className = "card " + c.type;
    if (c.type === "confirm") {
      d.innerHTML = `<div class="k">Needs your OK</div><div class="s"></div><div class="row"><button class="btn yes">Haan, karo</button><button class="btn no">Nahi</button></div>`;
      d.querySelector(".s").textContent = c.summary;
      d.querySelector(".yes").onclick = () => decide(c.id, true, d);
      d.querySelector(".no").onclick = () => decide(c.id, false, d);
    } else if (c.type === "video") {
      d.innerHTML = `<div class="k">Video ready</div><video controls playsinline></video>`;
      d.querySelector("video").src = c.url;
    } else if (c.type === "link") {
      d.innerHTML = `<div class="k"></div><a target="_blank" rel="noopener"></a>`;
      d.querySelector(".k").textContent = c.url.includes("wa.me/") ? "Open WhatsApp · tap send" : (c.label || "Open").slice(0, 40);
      const a = d.querySelector("a"); a.href = c.url; a.textContent = c.url.replace(/^https?:\/\//, "").slice(0, 70) + "…";
    }
    feed.append(d);
  }
  scroll(); speak(reply.say);
  // auto-open checkout / WhatsApp after an approved action
  const open = (reply.cards || []).find(c => c.type === "link" && reply.autoOpen);
  if (open) window.open(open.url, "_blank", "noopener");
}

async function post(path, body) {
  const r = await fetch(path, {method: "POST", headers, body: JSON.stringify(body)});
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function send(text) {
  text = (text || "").trim(); if (!text) return;
  bubble(text, "me"); $("#input").value = ""; setState("thinking", "Thinking…");
  try { render(await post("/api/chat", {session: SESSION, text})); }
  catch { bubble("G1 Core se connect nahi ho paaya.", "g1"); setState(null, "Offline"); }
}

async function decide(id, approve, card) {
  card.classList.add("done"); setState("thinking", approve ? "Doing it…" : "Cancelling…");
  try { const r = await post("/api/confirm", {session: SESSION, id, approve}); r.autoOpen = approve; render(r); }
  catch { bubble("Kuch gadbad ho gayi.", "g1"); setState(null, ""); }
}

// ---- voice in
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function listen() {
  if (!SR) { state.textContent = "Voice needs Chrome; type instead"; $("#input").focus(); return; }
  speechSynthesis && speechSynthesis.cancel();
  rec = new SR(); rec.lang = $("#lang").value; rec.interimResults = true;
  let finalText = "";
  rec.onstart = () => setState("listening", "Listening…");
  rec.onresult = e => { finalText = Array.from(e.results).map(r => r[0].transcript).join(" "); state.textContent = finalText; };
  rec.onerror = () => setState(null, "Didn't catch that");
  rec.onend = () => { if (finalText) send(finalText); else setState(null, "Tap the eye or say something"); };
  rec.start();
}
$("#orb").onclick = listen; $("#mic").onclick = listen;
$("#form").onsubmit = e => { e.preventDefault(); send($("#input").value); };

// ---- clock, status, reminders
setInterval(() => $("#clock").textContent = new Date().toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"}), 1000);
fetch("/api/status", {headers}).then(r => r.json()).then(s => $("#brain").textContent = s.brain === "Mock" ? "demo brain" : s.brain).catch(() => {});
setInterval(async () => {
  try {
    const r = await (await fetch("/api/events", {headers})).json();
    for (const x of r.reminders || []) render({say: "⏰ Reminder: " + x.text, cards: []});
  } catch {}
}, 15000);
</script>
</body>
</html>
